<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FicSiete - Cartas</title>
    <script src="./js/sessao.js"></script>
    <script src="./js/navbar.js"></script>
    <link rel="stylesheet" href="./css/estilo.css" />
    <link rel="stylesheet" href="./css/ficsite-conteudo.css" />
    <script>window.NAV_ACTIVE = 'cartas';</script>
    <script src="./js/sessao.js"></script>
    <script src="./js/navbar.js"></script>
</head>

<body onload="validarSessao()">
    <div class="header">
        <div class="container">
            <h1 class="titulo">FicSiete</h1>
            <ul class="navbar">
                <li><a href="index.html">Home</a></li>
                <li class="requires-auth"><a href="quizzes.html">Quizzes</a></li>
                <li class="requires-auth"><a href="publicacoes.html">Publicações</a></li>
                <li class="requires-auth"><a href="cartas.html" class="agora">Cartas</a></li>
                <li class="requires-auth"><a href="dashboard/dashboard.html">Dashboard</a></li>
                <!-- avatar placeholder -->
                <li class="profile-li">
                    <img id="profileImg" src="/assets/icon/usuario_comum.png" alt="avatar" class="profile-circle" />
                    <div id="profileDropdown" class="profile-dropdown hidden">
                        <strong id="profileName">Usuário</strong>
                        <div id="profileArroba"></div>
                        <div id="profileEmail"></div>
                        <hr />
                        <a href="#" id="logoutLink">Sair</a>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <div class="container main-conteudo">
        <div class="top-actions">
            <h2>Galeria de Cartas</h2>
            <button id="btnNovaCarta" class="botao">Forjar Nova Carta</button>
        </div>

        <div id="listaCartas" class="grid-cards"></div>
    </div>

    <div id="modalForja" class="modal">
        <div class="modal-content large">
            <h3>Forjar Carta</h3>
            <div class="campo"><input id="tituloCarta" placeholder="Título da Carta" /></div>
            <div class="campo">
                <label for="tipo_input">Gênero / Mundo ficcional</label>
                <select id="tipo_input">
                    <option value="Ficção especulativa">Ficção especulativa</option>
                    <option value="Fantasia Sobrenatural">Fantasia Sobrenatural</option>
                    <option value="Ficção científica">Ficção científica</option>
                    <option value="Terror">Terror</option>
                    <option value="Suspense">Suspense</option>
                    <option value="Ficção histórica">Ficção histórica</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>
            <div class="campo"><input id="nivelForca" placeholder="Nível de Força" /></div>
            <div class="campo"><input id="capaCarta" type="file" /></div>
            <div class="actions"><button id="btnForjar" class="botao">Forjar</button><button id="btnFecharForja"
                    class="botao sec">Fechar</button></div>
        </div>
    </div>

    <script>
        const lista = document.getElementById('listaCartas');
        const modal = document.getElementById('modalForja');
        document.getElementById('btnNovaCarta').addEventListener('click', () => modal.style.display = 'flex');
        document.getElementById('btnFecharForja').addEventListener('click', () => modal.style.display = 'none');

        async function carregar() {
            lista.innerHTML = '';
            let res = await fetch('/cartas/listar');
            if (res.ok) {
                let dados = await res.json();
                dados.forEach(c => {
                    let card = document.createElement('div');
                    card.className = 'card-mini';
                    card.innerHTML = `<h4>${c.titulo}</h4><p>Autor: ${c.nome}</p><small>${c.dtConfeccao}</small>`;
                    lista.appendChild(card);
                });
            }
        }

        document.getElementById('btnForjar').addEventListener('click', async () => {
            const titulo = document.getElementById('tituloCarta').value;
            const tipo = document.getElementById('tipoMundo').value;
            const nivel = document.getElementById('nivelForca').value;
            const file = document.getElementById('capaCarta').files[0];
            let data = null;


            if (file) data = await new Promise((r, rej) => {
                let fr = new FileReader();
                fr.onload = () => r(fr.result);
                fr.onerror = e => rej(e);
                fr.readAsDataURL(file);
            });

            const usuarioId = sessionStorage.ID_USUARIO || 1;
            let res = await fetch(`/cartas/publicar/${usuarioId}`,
                {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ titulo, img: data, tipoMundoFiccional: tipo, nivelForca: nivel })
                });

            if (res.ok) { modal.style.display = 'none'; carregar(); } else { alert(await res.text()); }
        });

        carregar();
    </script>
</body>

</html>
