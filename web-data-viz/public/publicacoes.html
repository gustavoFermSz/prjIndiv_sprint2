<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FicSiete - Publicações</title>
  <script src="./js/sessao.js"></script>
  <script src="./js/navbar.js"></script>
  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="stylesheet" href="./css/ficsite-conteudo.css" />
  <script>window.NAV_ACTIVE = 'publicacoes';</script>
  <script src="./js/sessao.js"></script>
  <script src="./js/navbar.js"></script>
</head>

<body onload="validarSessao()">
  <div class="header">
    <div class="container">
      <h1 class="titulo">FicSiete</h1>
      <ul class="navbar">
        <li><a href="index.html">Home</a></li>
        <li class="requires-auth"><a href="quizzes.html">Quizzes</a></li>
        <li class="requires-auth"><a href="publicacoes.html" class="agora">Publicações</a></li>
        <li class="requires-auth"><a href="cartas.html">Cartas</a></li>
        <li class="requires-auth"><a href="dashboard/dashboard.html">Dashboard</a></li>
        <!-- avatar placeholder -->
        <li class="profile-li">
          <img id="profileImg" src="/assets/icon/usuario_comum.png" alt="avatar" class="profile-circle" />
          <div id="profileDropdown" class="profile-dropdown hidden">
            <strong id="profileName">Usuário</strong>
            <div id="profileArroba"></div>
            <div id="profileEmail"></div>
            <hr />
            <a href="#" id="logoutLink">Sair</a>
          </div>
        </li>
      </ul>
    </div>
  </div>

  <div class="container main-conteudo">
    <div class="mural-panel panel-fullwidth">
      <div class="mural-header">
        <h2>Mural de Publicações</h2>
        <div class="mural-sub">Ordenadas por Mais Recentes • <strong id="totalCount">0</strong> catalogadas</div>
      </div>

      <div class="mural-controls">
        <div class="mural-search">
          <input type="text" id="searchInput" placeholder="Buscar por título, autor (@arroba), gênero..." />
        </div>
        <div class="mural-actions">
          <button class="btn-novo" id="btnNovo">Nova Crônica</button>
        </div>
      </div>

      <div id="listaPublicacoes" class="grid-cards"></div>
    </div>
  </div>

  <!-- Modal de visualização da publicação -->
  <div id="modalVisualizar" class="modal">
    <div class="modal-content large" id="visualizarContent">
      <button class="botao sec" id="btnFecharVisual">Fechar</button>
      <h2 id="viewTitulo"></h2>
      <div id="viewMeta" class="campo"></div>
      <img id="viewCapa" src="" alt="Capa" class="view-capa" />
      <div id="viewParagrafos"></div>
      <div class="actions">
        <button class="botao" id="btnEditarView">Editar</button>
      </div>
    </div>
  </div>
  <!-- edição e criação agora são páginas separadas -->


  <script>
    // simplified: listing and viewing; creation/edit live on their own pages
    const lista = document.getElementById('listaPublicacoes');
    const modalVisual = document.getElementById('modalVisualizar');
    const btnFecharVisual = document.getElementById('btnFecharVisual');
    const viewTitulo = document.getElementById('viewTitulo');
    const viewMeta = document.getElementById('viewMeta');
    const viewCapa = document.getElementById('viewCapa');
    const viewParagrafos = document.getElementById('viewParagrafos');
    const btnEditarView = document.getElementById('btnEditarView');

    // navigate to creation page
    const btnNovo = document.getElementById('btnNovo');
    if (btnNovo) btnNovo.addEventListener('click', () => window.location = 'publicar.html');

    function abrirModalVisual() { modalVisual.style.display = 'flex'; }
    function fecharModalVisual() { modalVisual.style.display = 'none'; }

    async function carregar(filter) {
      lista.innerHTML = '';
      let res = await fetch('/publicacoes/listar');
      if (res.ok) {
        let dados = await res.json();
        const totalCountEl = document.getElementById('totalCount');
        if (totalCountEl) totalCountEl.innerText = dados.length;
        if (filter && filter.trim()) {
          const q = filter.trim().toLowerCase();
          dados = dados.filter(d => (d.titulo || '').toLowerCase().includes(q) || (d.nome || '').toLowerCase().includes(q));
        }
        dados.forEach(p => {
          let card = document.createElement('div');
          card.className = 'card-mini';
          card.innerHTML = `
            <img class="capa" src="/publicacoes/${p.id}/capa" alt="capa" />
            <h4>${p.titulo}</h4>
            <div class="meta">${p.nome} • ${new Date(p.momentoCriacao).toLocaleString()}</div>
            <div class="meta">${p.qtdParagrafos || 0} parágrafo(s)</div>
          `;
          card.addEventListener('click', () => abrirVisual(p.id));
          lista.appendChild(card);
        });
      }
    }

    const searchInputEl = document.getElementById('searchInput');
    if (searchInputEl) searchInputEl.addEventListener('input', (e) => carregar(e.target.value));

    async function abrirVisual(id) {
      let res = await fetch(`/publicacoes/${id}`);
      if (!res.ok) { alert('Erro ao carregar publicação'); return; }
      let pub = await res.json();
      viewTitulo.innerText = pub.titulo;
      viewMeta.innerText = `Autor: ${pub.nome} • ${new Date(pub.momentoCriacao).toLocaleString()}`;
      viewCapa.src = `/publicacoes/${id}/capa`;
      viewParagrafos.innerHTML = '';
      for (let i = 0; i < pub.paragrafos.length; i++) {
        const p = pub.paragrafos[i];
        const div = document.createElement('div');
        div.className = 'card-full';
        div.innerHTML = `<h4>${p.numeroNaOrdem}. ${p.subtitulo || ''}</h4><p>${p.conteudo}</p>`;
        if (p.temImagem) {
          const img = document.createElement('img');
          img.src = `/publicacoes/${id}/paragrafo/${p.id}/img`;
          img.style.width = '100%'; img.style.borderRadius = '6px'; img.style.marginTop = '8px'; img.style.objectFit = 'cover';
          div.appendChild(img);
        }
        viewParagrafos.appendChild(div);
      }
      btnEditarView.onclick = () => { window.location = `editar_publicacao.html?id=${id}`; };
      abrirModalVisual();
    }

    btnFecharVisual.addEventListener('click', fecharModalVisual);

    carregar();
  </script>
</body>

</html>
